name: Issue14 offline contracts
on:
  push:
    paths: ['mods/**', 'tests/**', 'tools/**', '.github/workflows/issue14.yml']
  pull_request:
    paths: ['mods/**', 'tests/**', 'tools/**', '.github/workflows/issue14.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
